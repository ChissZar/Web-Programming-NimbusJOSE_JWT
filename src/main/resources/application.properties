spring.application.name=JWT_springboot3
server.port=8005

# ===================================================================
# 1. H2 In-Memory Database (Mặc định chạy mượt mà ngay lập tức, không cần cài MySQL)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:jwt_springboot3;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# 2. Cấu hình MySQL theo đúng Slide 21 (Bỏ comment khi dùng MySQL)
# ===================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/jwt_springboot3?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=1234567@a$

## Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ===================================================================
# Cấu hình Secret Key và thời gian hết hạn cho Nimbus JOSE + JWT
# ===================================================================
security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# 1h in millisecond (3600000 ms)
security.jwt.expiration-time=3600000
