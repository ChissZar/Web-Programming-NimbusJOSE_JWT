<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Spring Boot REST API with ajax</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .main-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            padding: 35px;
            max-width: 800px;
            margin: auto;
        }
        .user-badge {
            background: #e0f2fe;
            color: #0369a1;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .token-box {
            background: #1e293b;
            color: #38bdf8;
            padding: 12px 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.82rem;
            word-break: break-all;
            max-height: 100px;
            overflow-y: auto;
        }
        #images {
            border-radius: 50%;
            border: 3px solid #3b82f6;
            object-fit: cover;
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <div class="container" style="min-height: 500px">
        <div class="starter-template main-card">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div>
                    <span class="user-badge mb-2 d-inline-block">🔐 Nimbus JOSE + JWT Authenticated</span>
                    <h1 class="h3 fw-bold mb-0">Spring Boot REST API with AJAX Example</h1>
                </div>
                <button id="logout" class="btn btn-outline-danger btn-sm px-3 fw-bold">Logout</button>
            </div>

            <div class="row align-items-center mb-4">
                <div class="col-auto">
                    <img id="images" src="/images/avatar.png" alt="User Avatar" width="100" height="100" class="shadow-sm">
                </div>
                <div class="col">
                    <h4 id="profile" class="fw-bold text-dark mb-1">Đang tải thông tin...</h4>
                    <p id="user-email-display" class="text-muted mb-0 small"></p>
                </div>
            </div>

            <div class="mb-4">
                <h6 class="fw-semibold text-secondary">JWT Token hiện tại trong localStorage:</h6>
                <div id="token-display" class="token-box">Đang tải token...</div>
            </div>

            <div class="card bg-light border-0 p-3 mb-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="fw-bold mb-0 text-dark">Danh sách người dùng (/users)</h6>
                    <button id="btn-load-users" class="btn btn-sm btn-primary">Tải danh sách</button>
                </div>
                <div id="users-list-container" class="small text-muted">
                    Nhấn "Tải danh sách" để gọi API GET /users với Bearer Token.
                </div>
            </div>

            <div id="feedback" class="text-danger small"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="/js/mainjs.js"></script>
</body>
</html>
